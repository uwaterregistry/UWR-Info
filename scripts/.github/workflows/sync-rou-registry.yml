
name: Sync UWR RoU Registry Mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  sync-registry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Synchronise public UWR records
        run: python scripts/sync_rou_registry.py

      - name: Commit updated registry data
        run: |
          git config user.name "UWR Registry Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/rou-projects.json
          git diff --cached --quiet || \
            git commit -m "Update public UWR RoU registry mirror"
          git push
